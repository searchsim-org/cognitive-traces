[tool.poetry]
name = "cognitive-traces-backend"
version = "0.1.0"
description = "Backend API for Cognitive Traces Annotation Framework"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-multipart = "^0.0.6"
anthropic = "^0.7.0"
openai = "^1.3.0"
google-generativeai = "^0.3.0"
pandas = "^2.1.3"
numpy = "^1.26.2"
sentence-transformers = "^2.2.2"
# Use the CPU-only PyTorch wheel; the default index ships ~1.5 GB of
# unused CUDA libs (nvidia-*, triton) that bloat both disk and RSS on
# our CPU-only VPS. The pytorch-cpu source is declared below.
torch = {version = "^2.1.1", source = "pytorch-cpu"}
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
psycopg2-binary = "^2.9.9"
# python-jose stays: required by the GitHub login spec (HS256 JWT decode).
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-dotenv = "^1.0.0"
httpx = "^0.25.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"
pre-commit = "^3.5.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

